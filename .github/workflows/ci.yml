name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    name: tests (py${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (editable, dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q
      - name: Validate contracts
        run: |
          python -m sable.cli validate snapshot tests/fixtures/snapshots/weak1.json
          python -m sable.cli validate results tests/fixtures/results/weak1.json --snapshot tests/fixtures/snapshots/weak1.json
      - name: Offline target acceptance
        run: python -m pytest -q tests/integration
